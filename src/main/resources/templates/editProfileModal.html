<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
<div class="fixed inset-0 flex items-center justify-center bg-gray-800 bg-opacity-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-4">Edit Profile</h2>
        <form th:action="@{/profile/update}" method="post">
            <input type="hidden" id="id" name="id" th:value="${user.id}">

            <div class="mb-4">
                <label for="firstName" class="block text-gray-700">First Name</label>
                <input type="text" id="firstName" name="firstName" class="w-full p-2 border border-gray-300 rounded mt-1" th:value="${user.firstName}">
            </div>
            <div class="mb-4">
                <label for="lastName" class="block text-gray-700">Last Name</label>
                <input type="text" id="lastName" name="lastName" class="w-full p-2 border border-gray-300 rounded mt-1" th:value="${user.lastName}">
            </div>
            <div class="mb-4">
                <label for="number" class="block text-gray-700">Phone Number</label>
                <input type="text" id="number" name="number" class="w-full p-2 border border-gray-300 rounded mt-1" th:value="${user.number}">
            </div>
            <div class="mb-4">
                <label for="age" class="block text-gray-700">Age</label>
                <input type="number" id="age" name="age" class="w-full p-2 border border-gray-300 rounded mt-1" th:value="${user.age}">
            </div>
            <div class="mb-4">
                <label for="gender" class="block text-gray-700">Gender</label>
                <select id="gender" name="gender" class="w-full p-2 border border-gray-300 rounded mt-1">
                    <option th:selected="${user.gender == 'Male'}" value="Male">Male</option>
                    <option th:selected="${user.gender == 'Female'}" value="Female">Female</option>
                    <option th:selected="${user.gender == 'Other'}" value="Other">Other</option>
                </select>
            </div>
            <div class="flex justify-end">
                <button type="button" class="bg-gray-500 text-white px-4 py-2 rounded mr-2" onclick="closeModal()">Cancel</button>
                <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded" >Save</button>
            </div>
        </form>
    </div>
</div>
<script>
    function closeModal() {
        document.getElementById('editProfileModal').style.display = 'none';
    }
</script>
</body>
</html>
