<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBC List</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script defer src="script.js"></script>
</head>
<body>
<header class="bg-white shadow-md">
    <div class="flex items-center justify-between p-4">
        <a href="/homePage" class="flex items-center gap-2">
            <i class="fa-solid fa-hand-holding-droplet text-red-500 text-2xl"></i>
            <h1 class="text-2xl font-bold text-red-500">BDMS Project</h1>
        </a>
        <div th:replace="~{navbar.html}"></div>
    </div>
</header>

<section class="text-center mb-10">
    <div class="text-center p-6">
        <h1 class="text-3xl font-bold">Organization List</h1>
    </div>

    <!-- HBC Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-6 px-4" id="hbc-list">
        <div th:each="hbc :${hbc}" class="w-full max-w-md p-6 bg-white rounded-lg shadow-md transform hover:scale-105 transition-transform duration-300">
            <div class="flex items-center space-x-4">
                <div>
                    <h2 class="text-lg font-bold" th:text="${hbc.hbc_name}">Organization Name</h2>
                    <p class="text-red-600" th:text="'Phone Number: ' + ${hbc.h_phone}">Phone Number: 01910401021</p>
                </div>
            </div>
            <div class="mt-4 text-gray-700 space-y-2 text-left">
                <p><span class="font-bold">Area:</span> <span th:text="${hbc.h_area}">Area</span></p>
                <p><span class="font-bold">City:</span> <span th:text="${hbc.h_city}">City</span></p>
                <p><span class="font-bold">Division:</span> <span th:text="${hbc.h_division}">Division</span></p>
                <p><span class="font-bold">Phone:</span> <span th:text="${hbc.h_phone}">Phone</span></p>
                <p><span class="font-bold">Organization Type:</span> <span th:text="${hbc.organization_type}">Organization Type</span></p>
            </div>
        </div>
    </div>
</section>
</body>
</html>
