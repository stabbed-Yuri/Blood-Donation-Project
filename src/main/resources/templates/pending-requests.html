<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipient Requests</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
  <h1 class="text-center mb-4">Recipient Requests</h1>

  <!-- Iterate through recipient requests -->
  <div th:each="request : ${requests}">
    <div class="card mb-3">
      <div class="card-body">
        <!-- Request Details -->
        <h5 class="card-title">Request ID: <span th:text="${request.r_id}"></span></h5>
        <p class="card-text">Recipient Name: <span th:text="${request.recipientName}"></span></p>
        <p class="card-text">Medical Purpose: <span th:text="${request.medical_purpose}"></span></p>
        <p class="card-text">Blood Group Needed: <span th:text="${request.blood_g_needed}"></span></p>
        <p class="card-text">Hospital: <span th:text="${request.hospitalName}"></span></p>
        <p class="card-text">Request Date: <span th:text="${request.requestDate}"></span></p>
        <!-- Accept Button -->
        <button class="btn btn-success" th:onclick="'acceptRequest(' + ${request.r_id} + ')'">Accept</button>
      </div>
    </div>
  </div>
</div>
<script>
  function acceptRequest(requestId) {
    // Implement the logic to handle the accept action
    console.log('Request accepted:', requestId);
    // You can make an AJAX call or redirect to another endpoint to process the acceptance
  }
</script>
</body>
</html>
