<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accepted Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="flex items-center justify-between p-4">
    <div class="flex items-center gap-2">
        <i class="fa-solid fa-hand-holding-droplet text-red-500 text-2xl"></i>
        <a href="/homePage">
            <h1 class="text-2xl font-bold text-red-500">BDMS Project</h1>
        </a>
    </div>




    <!-- Links for Desktop -->
    <div th:replace="~{navbar.html}"></div>

</div>
<div class="container mt-4">
    <h1 class="text-center mb-4 text-3xl">Accepted Requests</h1>

    <!-- Iterate through accepted requests -->
    <div th:each="request : ${acceptedRequests}">
        <div class="card mb-3">
            <div class="card-body">
                <!-- Request Details -->
                <h5 class="card-title">Request ID: <span th:text="${request.r_id}"></span></h5>
                <p class="card-text">Medical Purpose: <span th:text="${request.medical_purpose}"></span></p>
                <p class="card-text">Blood Group Needed: <span th:text="${request.blood_g_needed}"></span></p>
                <p class="card-text">Hospital: <span th:text="${request.hospitalName}"></span></p>
                <p class="card-text">Recipient name: <span th:text="${request.user.firstName} + ' ' + ${request.user.lastName}"></span></p>
                <p class="card-text">Status: <span th:text="${request.isClosed} ? 'Complete' : 'Incomplete'"></span></p>
                <p class="card-text">Recipient Phone Number:
                    <span th:text="${request.user.number}"></span>
                </p>
                <p class="card-text">
                    Address:
                    <span th:text="${request.hbc.h_division + ', ' + request.hbc.h_area + ', ' + request.hbc.h_area}"></span>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
