<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Donation - Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100">

  <!-- Header Section -->
  <header class="bg-white shadow-lg">
    <div class="flex items-center justify-between p-4">
        <a href="/homePage" class="flex items-center gap-2">
            <i class="fa-solid fa-hand-holding-droplet text-red-500 text-2xl"></i>
            <h1 class="text-xl md:text-2xl font-bold text-red-500">BDMS Project</h1>
        </a>


        <!-- Links for Desktop -->
        <div th:replace="~{navbar.html}"></div>
        <!-- Mobile Menu -->

    </div>
</header>


  <!-- Main Content Section -->
  <main class="pt-5 flex items-center justify-center min-h-screen px-4 sm:px-6 lg:px-8">

    <!-- Main Content Container (Sign-Up Form) -->
    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md mx-auto">
      <h2 class="text-center text-3xl font-extrabold text-gray-900">Sign Up to Donate</h2>
        <div th:if="${success}"
             class="alert success alert-dismissible fade show" role="alert">
            <strong>Well done!</strong> You successfully signed up.
            <button type="button" class="close" data-dismiss="alert" aria-label="Close"></button>
        </div>
        <form action="#" th:action="@{/signUp}" th:object="${user}" method="post" class="space-y-6 bg-white p-6 rounded-lg shadow-lg max-w-md mx-auto">
            <h2 class="text-2xl font-bold text-center text-gray-900">Sign Up</h2>

            <!-- Username -->
            <div class="space-y-1">
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input id="username" name="username" type="text" th:field="*{username}"
                       class="w-full px-4 py-2 border rounded-full border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900"
                       placeholder="Enter your username">
                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>

            <!-- First Name -->
            <div class="space-y-1">
                <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
                <input id="firstName" name="firstName" type="text" th:field="*{firstName}"
                       class="w-full px-4 py-2 border rounded-full border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900"
                       placeholder="Enter your first name">
                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
            </div>

            <!-- Last Name -->
            <div class="space-y-1">
                <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name</label>
                <input id="lastName" name="lastName" type="text" th:field="*{lastName}"
                       class="w-full px-4 py-2 border rounded-full border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900"
                       placeholder="Enter your last name">
                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
            </div>

            <!-- Email -->
            <div class="space-y-1">
                <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input id="email" name="email" type="email" th:field="*{email}"
                       class="w-full px-4 py-2 border rounded-full border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900"
                       placeholder="Enter your email">
                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <!-- Mobile Number -->
            <div class="space-y-1">
                <label for="number" class="block text-sm font-medium text-gray-700">Mobile Number</label>
                <input id="number" name="number" type="tel" th:field="*{number}"
                       class="w-full px-4 py-2 border rounded-full border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900"
                       placeholder="Enter your mobile number">
                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('number')}" th:errors="*{number}"></p>
            </div>

            <!-- Blood Type -->
            <div class="space-y-1">
                <label for="bloodType" class="block text-sm font-medium text-gray-700">Blood Type</label>
                <select id="bloodType" name="bloodType" th:field="*{bloodType}"
                        class="w-full px-4 py-2 border rounded-full border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900">
                    <option value="" disabled selected>Select your blood type</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('bloodType')}" th:errors="*{bloodType}"></p>
            </div>


            <!-- Age -->
            <div class="space-y-1">
                <label for="age" class="block text-sm font-medium text-gray-700">Age</label>
                <input id="age" name="age" type="number" th:field="*{age}"
                       class="w-full px-4 py-2 border rounded-full border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900"
                       placeholder="Enter your age">
                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></p>
            </div>

            <!-- Gender -->
            <div class="space-y-1">
                <label for="gender" class="block text-sm font-medium text-gray-700">Gender</label>
                <select id="gender" name="gender" th:field="*{gender}"
                        class="w-full px-4 py-2 border rounded-full border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900">
                    <option value="" disabled selected>Select your gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></p>
            </div>

            <div class="space-y-1">
                <label for="division" class="block text-sm font-medium text-gray-700">Division</label>
                <select id="division" name="division" th:field="*{division}"
                        class="w-full px-4 py-2 border rounded-full border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900" onchange="updateDistricts()">
                        <option value="">Division</option>
                        <option value="barisal">Barisal</option>
                        <option value="chattogram">Chattogram</option>
                        <option value="dhaka">Dhaka</option>
                        <option value="khulna">Khulna</option>
                        <option value="mymensingh">Mymensingh</option>
                        <option value="rajshahi">Rajshahi</option>
                        <option value="rangpur">Rangpur</option>
                        <option value="sylhet">Sylhet</option>
                </select>
                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('division')}" th:errors="*{division}"></p>
            </div>

            <div class="space-y-1">
                <label for="district" class="block text-sm font-medium text-gray-700">District</label>
                <select id="district" name="district" th:field="*{district}"
                        class="w-full px-4 py-2 border rounded-full border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900" onchange ="updateUpazilas()">
                    <option value="">District</option>
                </select>
                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('district')}" th:errors="*{district}"></p>
            </div>

            <div class="space-y-1">
                <label for="upazila" class="block text-sm font-medium text-gray-700">Upazila</label>
                <select id="upazila" name="upazila" th:field="*{upazila}"
                        class="w-full px-4 py-2 border rounded-full border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900">
                    <option value="">Upazila</option>
                </select>
                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('upazila')}" th:errors="*{upazila}"></p>
            </div>


            <!-- Password -->
            <div class="space-y-1">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input id="password" name="password" type="password" th:field="*{password}"
                       class="w-full px-4 py-2 border rounded-full border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900"
                       placeholder="Enter your password">
                <p class="text-sm text-red-600" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                    class="w-full py-2 px-4 bg-red-600 text-white font-bold rounded-full hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                Sign Up
            </button>
        </form>

        <!-- Link to Login Page -->
      <div class="text-center">
        <p class="text-sm text-gray-600">Already have an account?
          <a href="/login" class="font-medium text-indigo-600 hover:text-indigo-500">Login here</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Footer Section -->
  <footer class="bg-gray-900 text-white p-4">
    <div class="max-w-7xl mx-auto text-center">
      <p>&copy; 2024 Blood Donation Project. All rights reserved.</p>
      <p><a href="#" class="underline hover:text-gray-300">Privacy Policy</a> | <a href="#" class="underline hover:text-gray-300">Terms of Service</a></p>
    </div>
  </footer>

      function updateDistricts() {
          const divisionSelect = document.getElementById("division");
          const districtSelect = document.getElementById("district");
          const selectedDivision = divisionSelect.value;

          // Clear current options in district dropdown
          districtSelect.innerHTML = '<option value="">District</option>';

          // Populate district dropdown based on selected division
          if (selectedDivision && divisionDistrictMap[selectedDivision]) {
              divisionDistrictMap[selectedDivision].sort().forEach(district => {
                  const option = document.createElement("option");
                  option.value = district.toLowerCase();
                  option.textContent = district;
                  districtSelect.appendChild(option);
              });
          }
      }

      function updateUpazilas() {
          const districtSelect = document.getElementById("district");
          const upazilaSelect = document.getElementById("upazila");
          const selectedDistrict = districtSelect.value;

          // Clear current options in upazila dropdown
          upazilaSelect.innerHTML = '<option value="">Upazila</option>';

          // Populate upazila dropdown based on selected district
          if (selectedDistrict && districtUpazilaMap[selectedDistrict]) {
              districtUpazilaMap[selectedDistrict].sort().forEach(upazila => {
                  const option = document.createElement("option");
                  option.value = upazila.toLowerCase();
                  option.textContent = upazila;
                  upazilaSelect.appendChild(option);
              });
          }
      }

</html>
