<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Requests</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="flex items-center justify-between p-4">
    <div class="flex items-center gap-2">
        <i class="fa-solid fa-hand-holding-droplet text-red-500 text-2xl"></i>
        <a href="/homePage" class="flex items-center gap-2">
            <i class="fa-solid fa-hand-holding-droplet text-red-500 text-2xl"></i>
            <h1 class="text-xl md:text-2xl font-bold text-red-500">BDMS Project</h1>
        </a>
    </div>




    <!-- Links for Desktop -->
    <div th:replace="~{navbar.html}"></div>

</div>
<div class="container mt-4">
    <h1 class="text-center mb-4 text-3xl">Pending Requests</h1>

    <!-- Iterate through pending requests -->
    <div th:each="request : ${requests}">
        <!-- Only display the request if the user has not responded yet -->

        <div th:if="${!#lists.contains(request.respondedUsers, currentUser)}">
            <div class="card mb-3">
                <div class="card-body">
                    <!-- Request Details -->
                    <h5 class="card-title">Request ID: <span th:text="${request.r_id}"></span></h5>
                    <p class="card-text">Medical Purpose: <span th:text="${request.medical_purpose}"></span></p>
                    <p class="card-text">Blood Group Needed: <span th:text="${request.blood_g_needed}"></span></p>
                    <p class="card-text">Volume: <span th:text="${request.volume_needed}"></span></p>
                    <p class="card-text">Hospital: <span th:text="${request.hospitalName}"></span></p>
                    <p class="card-text">
                        Address:
                        <span th:text="${request.hbc.h_division + ', ' + request.hbc.h_area + ', ' + request.hbc.h_area}"></span>
                    </p>

                    <!-- Response Form -->
                    <form th:action="@{/respond}" method="post">
                        <input type="hidden" name="requestId" th:value="${request.r_id}" />

                        <!-- Accept Button -->
                        <button type="submit"
                                name="response"
                                value="accept"
                                class="btn btn-success"
                                th:disabled="${#lists.contains(request.respondedUsers, currentUser)}">
                            <span th:text="${#lists.contains(request.respondedUsers, currentUser) ? 'Accepted' : 'Accept'}"></span>
                        </button>

                        <!-- Reject Button -->
                        <button type="submit"
                                name="response"
                                value="reject"
                                class="btn btn-danger"
                                th:disabled="${#lists.contains(request.respondedUsers, currentUser)}">
                            <span th:text="${#lists.contains(request.respondedUsers, currentUser) ? 'Rejected' : 'Reject'}"></span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
